name: feed-agent
# Build-time shopping agent: refreshes /data/*.json + agents.json daily, validated by the same validate.js as admin.html.
on:
  schedule:
    - cron: '17 6 * * *'        # daily 06:17 UTC
  workflow_dispatch:            # "Run bot now" button in admin.html hits this
permissions:
  contents: write
concurrency:
  group: feed-agent
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run feed agent (real source if keys present, otherwise fixtures)
        env:
          SKIMLINKS_API_KEY: ${{ secrets.SKIMLINKS_API_KEY }}
          SKIMLINKS_PRODUCT_API: ${{ vars.SKIMLINKS_PRODUCT_API }}
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
          FEED_COUNTRY: ${{ vars.FEED_COUNTRY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-feed.mjs
      - name: Commit refreshed catalog
        run: |
          git config user.name "openshelf-bot"
          git config user.email "openshelf-bot@users.noreply.github.com"
          git add data agents.json index.html sitemap.xml robots.txt opensearch.xml openapi.json
          if git diff --cached --quiet; then echo "No catalog changes"; exit 0; fi
          git commit -m "bot: refresh catalog $(date -u +%F) [skip ci]"
          git push
