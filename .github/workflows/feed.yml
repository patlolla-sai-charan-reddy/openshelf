name: feed-agent
# Daily collector: pulls fresh products from retailers' public endpoints, validates, regenerates agents.json / index.html / discovery files, commits.
on:
  schedule:
    - cron: '17 6 * * *'        # daily 06:17 UTC
  workflow_dispatch:            # run it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: feed-agent
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect products from retailer endpoints (Shopify products.json, page JSON-LD/og)
        env:
          COLLECT_TOP: ${{ vars.COLLECT_TOP }}
        run: node scripts/build-catalog.mjs
      - name: Validate, refresh index + discovery files (optional Skimlinks/Sovrn feed if key present)
        env:
          SKIMLINKS_API_KEY: ${{ secrets.SKIMLINKS_API_KEY }}
          SKIMLINKS_PRODUCT_API: ${{ vars.SKIMLINKS_PRODUCT_API }}
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
          FEED_COUNTRY: ${{ vars.FEED_COUNTRY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-feed.mjs
      - name: Commit refreshed catalog
        run: |
          git config user.name "openshelf-bot"
          git config user.email "openshelf-bot@users.noreply.github.com"
          git add data agents.json index.html sitemap.xml robots.txt opensearch.xml openapi.json
          if git diff --cached --quiet; then echo "No catalog changes"; exit 0; fi
          git commit -m "bot: daily catalog $(date -u +%F) — $(node -e 'const fs=require("fs");let n=0;for(const f of fs.readdirSync("data"))n+=JSON.parse(fs.readFileSync("data/"+f)).length;console.log(n)') products [skip ci]"
          git push
